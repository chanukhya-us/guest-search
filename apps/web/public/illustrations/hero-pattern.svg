<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <!-- Original abstract artwork for IHG Guest Search (decorative). IHG navy/orange palette. -->
  <defs>
    <linearGradient id="arcGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8542c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8542c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="soft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfdbe8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bfdbe8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- soft light pools -->
  <circle cx="1180" cy="40" r="260" fill="url(#soft)"/>
  <circle cx="860" cy="330" r="200" fill="url(#soft)"/>

  <!-- concentric rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <circle cx="1240" cy="180" r="90"/>
    <circle cx="1240" cy="180" r="150"/>
    <circle cx="1240" cy="180" r="210"/>
    <circle cx="1240" cy="180" r="270"/>
  </g>

  <!-- orange accent arcs -->
  <path d="M960 360 A300 300 0 0 1 1440 70" fill="none" stroke="url(#arcGlow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1040 360 A240 240 0 0 1 1440 140" fill="none" stroke="#e8542c" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- dot grid -->
  <rect x="980" y="30" width="200" height="132" fill="url(#dots)"/>

  <!-- floating tiles (abstract guest cards) -->
  <g fill="#ffffff">
    <rect x="1110" y="220" width="96" height="56" rx="10" fill-opacity="0.07"/>
    <rect x="1124" y="236" width="40" height="6" rx="3" fill-opacity="0.22"/>
    <rect x="1124" y="250" width="62" height="6" rx="3" fill-opacity="0.14"/>
    <rect x="1290" y="96" width="78" height="46" rx="9" fill-opacity="0.07"/>
    <rect x="1302" y="110" width="32" height="5" rx="2.5" fill-opacity="0.22"/>
    <rect x="1302" y="122" width="50" height="5" rx="2.5" fill-opacity="0.14"/>
  </g>
  <circle cx="1206" cy="220" r="5" fill="#e8542c"/>
  <circle cx="1368" cy="96" r="3.5" fill="#e8542c" fill-opacity="0.8"/>
</svg>
